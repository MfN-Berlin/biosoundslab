services:
  traefik:
    image: traefik:latest
    command:
      - --api.insecure=true
      - --providers.docker=false
      - --providers.file.directory=/etc/traefik/dynamic_conf
      - --accesslog=true
      - --accesslog.fields.headers.defaultmode=keep
      - --accesslog.fields.headers.names.User-Agent=drop
      - --accesslog.fields.headers.names.Content-Type=drop
      - --entryPoints.web.address=:80

    ports:
      - 80:80
      - 8181:8080 # The Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic_conf:/etc/traefik/dynamic_conf
      - ./traefik/logs:/logs

    networks:
      - traefik-ingress
    extra_hosts:
      - host.docker.internal:host-gateway

  db:
    image: postgres:16
    shm_size: ${POSTGRES_SHM_SIZE}
#    restart: always
    environment:
      POSTGRES_DB: ecomon
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT}
          cpus: ${POSTGRES_CPU_LIMIT}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION}
          cpus: ${POSTGRES_CPU_RESERVATION}
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM}
      -c work_mem=${POSTGRES_WORK_MEM}
      -c checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET}
      -c wal_buffers=${POSTGRES_WAL_BUFFERS}
      -c default_statistics_target=${POSTGRES_DEFAULT_STATISTICS_TARGET}
      -c random_page_cost=${POSTGRES_RANDOM_PAGE_COST}
      -c effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY}
      -c min_wal_size=${POSTGRES_MIN_WAL_SIZE}
      -c max_wal_size=${POSTGRES_MAX_WAL_SIZE}
      -c max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES}
      -c max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER}
      -c max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS}
      -c max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS}
      -c huge_pages=try
      -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT}
    volumes:
      - ecomon_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
#      - ./postgres/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
      - ${PGBACKUP_PATH}:/backup
    networks:
      - ecomon

  db-migrate:
    build:
      context: ./hasura
      dockerfile: Dockerfile.hasura-migrate
    depends_on:
      - db
      - graphql-engine
    environment:
      HASURA_ENDPOINT: http://graphql-engine:8080
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      APPLY_METADATA: true
      APPLY_MIGRATIONS: true
      APPLY_SEEDS: true
    # import current files as volume so a rebuild is no required on database/metada changes
    volumes:
      - ./hasura:/app
    networks:
      - ecomon

  graphql-engine:
    image: hasura/graphql-engine:v2.38.0-ce
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          memory: ${HASURA_MEMORY_LIMIT}
          cpus: ${HASURA_CPU_LIMIT}
        reservations:
          memory: ${HASURA_MEMORY_RESERVATION}
          cpus: ${HASURA_CPU_RESERVATION}
#    restart: always
    environment:
      # Database connections
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/hasura
      PGDATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/ecomon

      # Console and dev settings
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE}
      HASURA_GRAPHQL_READ_ONLY_MODE: ${HASURA_GRAPHQL_READ_ONLY_MODE}
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: ${HASURA_GRAPHQL_ENABLED_LOG_TYPES}

      # Security
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: ${HASURA_GRAPHQL_UNAUTHORIZED_ROLE}

      # Performance tuning
      HASURA_GRAPHQL_CONNECTIONS_PER_READ_REPLICA: ${HASURA_GRAPHQL_CONNECTIONS_PER_READ_REPLICA}
      HASURA_GRAPHQL_STRIPES_PER_READ_REPLICA: ${HASURA_GRAPHQL_STRIPES_PER_READ_REPLICA}
      HASURA_GRAPHQL_POOL_TIMEOUT: ${HASURA_GRAPHQL_POOL_TIMEOUT}
      HASURA_GRAPHQL_CONNECTION_LIFETIME: ${HASURA_GRAPHQL_CONNECTION_LIFETIME}

      # Live queries optimization
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: ${HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL}
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: ${HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE}

      # Webhooks
      HASURA_WEBHOOKS_BASE_URL: ${HASURA_WEBHOOKS_BASE_URL}
    depends_on:
      - db
    networks:
      - ecomon
      - traefik-ingress
    extra_hosts:
      - host.docker.internal:host-gateway

  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT}
          cpus: ${REDIS_CPU_LIMIT}
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION}
          cpus: ${REDIS_CPU_RESERVATION}
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY}
      - --save
      - ${REDIS_SAVE_INTERVAL}
      - ${REDIS_SAVE_CHANGES}
      - --appendonly
      - ${REDIS_APPENDONLY}
      - --appendfsync
      - ${REDIS_APPENDFSYNC}
      - --tcp-keepalive
      - ${REDIS_TCP_KEEPALIVE}
      - --timeout
      - ${REDIS_TIMEOUT}
      - --tcp-backlog
      - ${REDIS_TCP_BACKLOG}
#    container_name: redis
    ports:
      - 6379:6379
    networks:
      - ecomon
    volumes:
      - redis_data:/data

  airflow:
    image: apache/airflow:2.7.2
    depends_on:
      - db
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/ecomon
      - AIRFLOW_CONN_POSTGRES_DEFAULT=postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/ecomon
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__BASE_URL=http://localhost/biosoundslab/airflow
#      - AIRFLOW__WEBSERVER__URL_PATH_PREFIX=/ecomon_validate/airflow
      - PG_USER=${DB_USERNAME}
      - PG_PASSWORD=${DB_PASSWORD}
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DATABASE=ecomon
      - MAX_BACKUPS=${MAX_BACKUPS}
      - CHUNK_SIZE=${BACKUP_CHUNK_SIZE}
      - API_URL=http://localhost/biosoundslab/api/v1/graphql
      - API_VERIFY_SSL=false
      - SUB_PATH=${SUB_PATH}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
#      - ./.env:/opt/airflow/airflow.env
      - ${BASE_DATA_DIRECTORY}:/data
      - ${PGBACKUP_PATH}:/backup
    ports:
      - "8282:8080"
    command: >
      bash -c "rm -f /opt/airflow/airflow.db &&
               airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
               airflow scheduler & airflow webserver"
#    restart: always
    networks:
      - traefik-ingress
      - ecomon

volumes:
  ecomon_data:
  redis_data:
  airflow_logs:

networks:
  ecomon:
    driver: bridge
  traefik-ingress:
    driver: bridge
